# Migrations Alembic de linkedin_market. Depuis la racine du dépôt :
#   .venv/bin/alembic -c linkedin_market/alembic.ini upgrade head
#   .venv/bin/alembic -c linkedin_market/alembic.ini check
#   .venv/bin/alembic -c linkedin_market/alembic.ini revision --autogenerate --rev-id 0002 -m "objet"
# L'URL de connexion vient de LM_DATABASE_URL (.env racine), jamais de ce fichier.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s/..
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
